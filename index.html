<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="google-site-verification" content="THR9CS9cW8LGx-WiKQAFdLYgRBljsr9ZpoDvwFArK3k">
    <meta name="google-site-verification" content="KA9Lh1Q44Dbeu7fuIhpKggedTJ8RHKu4GbK2PGAE_6s" />

    <meta name="description" content="ClassCharts Improver - Transform your school portal experience with automated homework organization, visual enhancements, and powerful tools. Join 60+ students already using the ultimate ClassCharts toolkit.">
    <meta name="keywords" content="ClassCharts, school portal, homework tracker, student tools, browser extension, Chrome extension, education, school management">
    <meta name="author" content="James Theakston">
    <meta name="robots" content="index, follow">
    <link rel="canonical" href="https://classchartsimprover.pages.dev">
    
    <meta property="og:title" content="ClassCharts Improver - Transform Your School Portal Experience">
    <meta property="og:description" content="Join 60+ students using the ultimate ClassCharts toolkit. Automated homework organization, visual enhancements, and powerful tools for students.">
    <meta property="og:url" content="https://classchartsimprover.pages.dev">
    <meta property="og:type" content="website">
    
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="ClassCharts Improver - Transform Your School Portal Experience">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Inter', sans-serif; }
        .hero-gradient { background: radial-gradient(circle at 50% 50%, #f8fafc 0%, #ffffff 100%); }
        .glass-card { background: #ffffff; border: 1px solid #e2e8f0; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05); }
        .feature-card:hover { transform: translateY(-5px); transition: all 0.3s ease; border-color: #3b82f6; }
        .review-slide { min-width: 100%; flex-shrink: 0; transition: opacity 0.5s ease; }
        #review-slider { display: flex; transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1); }
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #f1f5f9; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        .video-container { position: relative; padding-bottom: 56.25%; height: 0; overflow: hidden; }
        .video-container iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border-radius: 1rem; }
    </style>
</head>
<body class="bg-white text-slate-800 antialiased">

    <nav class="fixed w-full z-50 bg-white/80 backdrop-blur-md border-b border-slate-100">
        <div class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">
            <div class="flex items-center space-x-2">
                <div class="bg-blue-600 p-2 rounded-lg"><i class="fas fa-chart-bar text-white text-sm"></i></div>
                <span class="text-xl font-bold tracking-tight text-slate-900">CC <span class="text-blue-600">Improver</span></span>
            </div>
            <a href="https://chromewebstore.google.com/detail/classcharts-improver/kalmdpfngeebamgaeegkieojhbkbghoe" target="_blank" class="bg-slate-900 hover:bg-black text-white px-5 py-2 rounded-full text-sm font-semibold transition">Add to Chrome</a>
        </div>
    </nav>

    <header class="pt-40 pb-20 px-6 hero-gradient overflow-hidden">
        <div class="max-w-7xl mx-auto grid md:grid-cols-2 gap-12 items-center">
            <div>
                <span class="inline-block px-4 py-1.5 mb-6 text-xs font-bold tracking-widest text-blue-600 uppercase bg-blue-50 rounded-full border border-blue-100">The Ultimate Toolkit</span>
                <h1 class="text-5xl md:text-6xl font-extrabold text-slate-900 mb-6 leading-tight">ClassCharts, <span class="text-transparent bg-clip-text bg-gradient-to-r from-blue-600 to-indigo-600">Reimagined.</span></h1>
                <p class="text-lg md:text-xl text-slate-600 max-w-xl mb-10">Upgrade your school portal experience with automated homework organization and powerful tools designed for students.</p>
                <a href="https://chromewebstore.google.com/detail/classcharts-improver/kalmdpfngeebamgaeegkieojhbkbghoe" target="_blank">
                    <img src="https://developer.chrome.com/static/docs/webstore/branding/image/YT2Grfi9vEBa2wAPzhWa.png" alt="Chrome Web Store" class="h-14 shadow-lg rounded-xl">
                </a>
            </div>
            <div class="glass-card p-2 rounded-2xl shadow-2xl">
                <div class="video-container">
                    <iframe src="https://www.youtube.com/embed/3cAEsMirXqc?si=0FdqCG0WRoIk17KL" title="YouTube video player" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe>
                </div>
            </div>
        </div>
    </header>

    <section class="py-12 bg-white border-y border-slate-100">
        <div class="max-w-4xl mx-auto px-6 text-center">
            <div class="text-3xl font-extrabold text-slate-900 mb-1"><span id="active-users-count">60</span>+</div>
            <div class="text-xs font-bold text-slate-400 uppercase tracking-widest">Active Student Users</div>
        </div>
    </section>

    <section class="py-24 px-6 bg-slate-50 overflow-hidden" id="reviews">
        <div class="max-w-4xl mx-auto text-center">
            <h2 class="text-3xl font-bold text-slate-900 mb-12">What Students Say</h2>
            <div id="review-container" class="relative group">
                <div class="overflow-hidden">
                    <div id="review-slider"></div>
                </div>
                <button onclick="prevReview()" class="absolute left-0 top-1/2 -translate-y-1/2 z-20 bg-white p-4 rounded-full shadow-lg border border-slate-100 hover:text-blue-600 transition"><i class="fas fa-chevron-left text-2xl"></i></button>
                <button onclick="nextReview()" class="absolute right-0 top-1/2 -translate-y-1/2 z-20 bg-white p-4 rounded-full shadow-lg border border-slate-100 hover:text-blue-600 transition"><i class="fas fa-chevron-right text-2xl"></i></button>
            </div>
        </div>
    </section>

    <script>
        const slider = document.getElementById('review-slider');
        let currentIdx = 0;
        let reviewsData = [];

        async function initReviews() {
            try {
                const response = await fetch('reviews.json');
                if(!response.ok) throw new Error("Failed");
                reviewsData = await response.json();
                
                reviewsData.forEach(review => {
                    const slide = document.createElement('div');
                    slide.className = 'review-slide px-4';
                    
                    let stars = '';
                    for(let i=0; i<5; i++) stars += i < review.stars ? '<i class="fas fa-star text-amber-400"></i>' : '<i class="far fa-star text-slate-300"></i>';

                    slide.innerHTML = `<div class="glass-card p-8 rounded-2xl max-w-lg mx-auto h-full flex flex-col">
                        <i class="fas fa-quote-right text-blue-200 text-5xl mb-4 self-start"></i>
                        <p class="text-lg italic mb-6 text-slate-700 flex-grow">"${review.text}"</p>
                        <div class="flex items-center gap-4 mt-auto">
                            ${review.photo ? `<img src="${review.photo}" class="w-12 h-12 rounded-full">` : `<div class="w-12 h-12 rounded-full bg-blue-100 flex items-center justify-center font-bold text-blue-600">${review.name.charAt(0)}</div>`}
                            <div class="text-left">
                                <p class="font-bold text-slate-900">${review.name}</p>
                                <p class="text-xs text-blue-600 font-semibold">${review.source}</p>
                                <div class="mt-1">${stars}</div>
                            </div>
                        </div>
                    </div>`;
                    slider.appendChild(slide);
                });
            } catch (err) {
                showErrorState();
            }
        }

        function showErrorState() {
            const container = document.getElementById('review-container');
            container.innerHTML = `<div class="glass-card p-8 rounded-2xl max-w-lg mx-auto bg-amber-50 border-amber-100">
                <i class="fas fa-exclamation-triangle text-amber-500 text-2xl mb-4"></i>
                <p class="text-slate-600">We're having trouble fetching reviews right now. Please check back later!</p>
            </div>`;
        }

        function nextReview() {
            if (currentIdx < reviewsData.length - 1) {
                currentIdx++;
                slider.style.transform = `translateX(-${currentIdx * 100}%)`;
            }
        }

        function prevReview() {
            if (currentIdx > 0) {
                currentIdx--;
                slider.style.transform = `translateX(-${currentIdx * 100}%)`;
            }
        }

        function animateCountup(elementId, target) {
            const el = document.getElementById(elementId);
            let count = 0;
            const interval = setInterval(() => {
                count += Math.ceil(target / 50);
                if(count >= target) { el.textContent = target; clearInterval(interval); }
                else el.textContent = count;
            }, 40);
        }
        
        animateCountup('active-users-count', 60);
        initReviews();
    </script>
</body>
</html>
