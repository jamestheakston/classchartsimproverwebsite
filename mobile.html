<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ClassCharts Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #0f172a; color: white; }
    </style>
</head>
<body>

<div id="loginPage" class="min-h-screen flex items-center justify-center p-6">
    <div class="bg-gray-900 border border-gray-800 rounded-3xl p-8 w-full max-w-md shadow-2xl">
        <h2 class="text-2xl font-bold mb-2">ClassCharts Login</h2>
        <p class="opacity-70 mb-6">Enter your student credentials.</p>
        <div id="loginMessage" class="mb-4"></div>
        <input type="text" id="code" placeholder="Student Code" class="w-full p-4 rounded-xl bg-gray-800 border-none outline-none mb-4">
        <input type="date" id="dob" class="w-full p-4 rounded-xl bg-gray-800 border-none outline-none mb-6">
        <button onclick="login()" class="w-full p-4 rounded-xl bg-blue-600 font-bold hover:opacity-90 transition">Login</button>
    </div>
</div>

<div id="dashboard" class="hidden min-h-screen">
    <header class="bg-gray-900 border-b border-gray-800 p-6 flex justify-between items-center">
        <h1 id="studentName" class="text-xl font-bold">Dashboard</h1>
        <button class="bg-gray-800 px-5 py-2 rounded-lg hover:bg-gray-700 transition" onclick="logout()">
            <i class="fas fa-sign-out-alt mr-2"></i>Logout
        </button>
    </header>
    <div class="max-w-7xl mx-auto p-6 grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
        <div class="bg-gray-900 border border-gray-800 rounded-2xl p-6">
            <h3 class="font-bold mb-4"><i class="fas fa-book mr-2"></i>Homework</h3>
            <div id="homework"></div>
        </div>
        <div class="bg-gray-900 border border-gray-800 rounded-2xl p-6">
            <h3 class="font-bold mb-4"><i class="fas fa-chart-line mr-2"></i>Behaviour</h3>
            <div id="behaviour"></div>
        </div>
        <div class="bg-gray-900 border border-gray-800 rounded-2xl p-6">
            <h3 class="font-bold mb-4"><i class="fas fa-bullhorn mr-2"></i>Announcements</h3>
            <div id="announcements"></div>
        </div>
        <div class="bg-gray-900 border border-gray-800 rounded-2xl p-6">
            <h3 class="font-bold mb-4"><i class="fas fa-user-check mr-2"></i>Attendance</h3>
            <div id="attendance"></div>
        </div>
        <div class="bg-gray-900 border border-gray-800 rounded-2xl p-6">
            <h3 class="font-bold mb-4"><i class="fas fa-history mr-2"></i>Activity</h3>
            <div id="activity"></div>
        </div>
        <div class="bg-gray-900 border border-gray-800 rounded-2xl p-6">
            <h3 class="font-bold mb-4"><i class="fas fa-chalkboard-teacher mr-2"></i>Classes</h3>
            <div id="classes"></div>
        </div>
    </div>
</div>

<script>
    let studentId = localStorage.getItem("cc_student_id");
    let sessionId = localStorage.getItem("cc_session_id");

    function setMessage(text, type = "error") {
        const color = type === "success" ? "bg-green-900" : "bg-red-900";
        document.getElementById("loginMessage").innerHTML = `<div class="${color} p-4 rounded-xl">${text}</div>`;
    }

    async function login() {
        const code = document.getElementById("code").value.trim();
        const dob = document.getElementById("dob").value;
        if(!code || !dob) return setMessage("Fill in all fields");
        try {
            const response = await fetch("/login", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ code, dob })
            });
            const data = await response.json();
            if(data.success === 1) {
                studentId = data.data.id;
                sessionId = data.meta.session_id;
                localStorage.setItem("cc_student_id", studentId);
                localStorage.setItem("cc_session_id", sessionId);
                document.getElementById("loginPage").style.display = "none";
                document.getElementById("dashboard").style.display = "block";
                loadAll();
            } else {
                setMessage(data.error || "Login failed");
            }
        } catch(err) {
            setMessage("Connection error");
        }
    }

    async function api(endpoint) {
        const response = await fetch(`/api/${endpoint}/${studentId}`, {
            headers: { Authorization: `Basic ${sessionId}` }
        });
        return await response.json();
    }

    function renderList(id, items, renderer) {
        const el = document.getElementById(id);
        el.innerHTML = items?.length ? items.map(renderer).join("") : '<div class="opacity-50">No data</div>';
    }

    async function loadAll() {
        const homework = await api("homeworks");
        renderList("homework", homework.data, hw => `<div class="bg-gray-800 p-3 rounded-lg mb-2">${hw.title}</div>`);
        const behaviour = await api("behaviour");
        renderList("behaviour", behaviour.data, b => `<div class="bg-gray-800 p-3 rounded-lg mb-2">${b.reason}</div>`);
        const announcements = await api("announcements");
        renderList("announcements", announcements.data, a => `<div class="bg-gray-800 p-3 rounded-lg mb-2">${a.title}</div>`);
        const attendance = await api("attendance");
        document.getElementById("attendance").innerHTML = `<div class="bg-gray-800 p-3 rounded-lg">${attendance.meta.percentage}%</div>`;
        const activity = await api("activity");
        renderList("activity", activity.data, a => `<div class="bg-gray-800 p-3 rounded-lg mb-2">${a.title}</div>`);
        const classes = await api("classes");
        renderList("classes", classes.data, c => `<div class="bg-gray-800 p-3 rounded-lg mb-2">${c.name}</div>`);
    }

    function logout() {
        localStorage.clear();
        location.reload();
    }

    if(studentId && sessionId) {
        document.getElementById("loginPage").style.display = "none";
        document.getElementById("dashboard").style.display = "block";
        loadAll();
    }
</script>
</body>
</html>
