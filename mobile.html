<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ClassCharts Dashboard</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Inter,Arial,sans-serif;
}

body{
    background:#0f172a;
    color:white;
    min-height:100vh;
}

header{
    background:#111827;
    border-bottom:1px solid #1f2937;
    padding:20px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

header h1{
    font-size:24px;
}

.container{
    max-width:1300px;
    margin:auto;
    padding:20px;
}

.login-screen{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
}

.login-box{
    width:100%;
    max-width:420px;
    background:#111827;
    border:1px solid #1f2937;
    border-radius:24px;
    padding:30px;
}

.login-box h2{
    margin-bottom:10px;
}

.login-box p{
    opacity:0.7;
    margin-bottom:25px;
}

input{
    width:100%;
    padding:14px;
    border:none;
    border-radius:14px;
    margin-bottom:15px;
    background:#1f2937;
    color:white;
    outline:none;
}

button{
    width:100%;
    padding:14px;
    border:none;
    border-radius:14px;
    background:#2563eb;
    color:white;
    font-weight:700;
    cursor:pointer;
    transition:0.2s;
}

button:hover{
    opacity:0.9;
}

.logout-btn{
    width:auto;
    padding:10px 18px;
}

.dashboard{
    display:none;
}

.cards{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(320px,1fr));
    gap:20px;
    margin-top:20px;
}

.card{
    background:#111827;
    border:1px solid #1f2937;
    border-radius:22px;
    padding:20px;
}

.card h3{
    margin-bottom:15px;
}

.item{
    background:#1f2937;
    padding:14px;
    border-radius:14px;
    margin-bottom:12px;
}

.small{
    font-size:13px;
    opacity:0.75;
    margin-top:4px;
}

.green{
    color:#22c55e;
}

.red{
    color:#ef4444;
}

.loading{
    opacity:0.5;
}

.empty{
    opacity:0.6;
}

.error{
    background:#7f1d1d;
    padding:12px;
    border-radius:12px;
    margin-bottom:15px;
}

.success{
    background:#14532d;
    padding:12px;
    border-radius:12px;
    margin-bottom:15px;
}
</style>
</head>
<body>

<div id="loginPage" class="login-screen">
    <div class="login-box">

        <h2>ClassCharts Login</h2>
        <p>Sign in with your student code and date of birth.</p>

        <div id="loginMessage"></div>

        <input
            type="text"
            id="code"
            placeholder="Student Code"
        >

        <input
            type="date"
            id="dob"
        >

        <button onclick="login()">
            Login
        </button>

    </div>
</div>

<div id="dashboard" class="dashboard">

    <header>
        <h1 id="studentName">Dashboard</h1>

        <button
            class="logout-btn"
            onclick="logout()"
        >
            Logout
        </button>
    </header>

    <div class="container">

        <div class="cards">

            <div class="card">
                <h3>Homework</h3>
                <div id="homework"></div>
            </div>

            <div class="card">
                <h3>Behaviour</h3>
                <div id="behaviour"></div>
            </div>

            <div class="card">
                <h3>Announcements</h3>
                <div id="announcements"></div>
            </div>

            <div class="card">
                <h3>Attendance</h3>
                <div id="attendance"></div>
            </div>

            <div class="card">
                <h3>Activity</h3>
                <div id="activity"></div>
            </div>

            <div class="card">
                <h3>Classes</h3>
                <div id="classes"></div>
            </div>

        </div>

    </div>

</div>

<script>

const API_BASE = "https://www.classcharts.com/apiv2student";

let studentId = null;
let sessionId = null;

function setMessage(text, type = "error") {

    document.getElementById("loginMessage").innerHTML = `
        <div class="${type}">
            ${text}
        </div>
    `;

}

function showDashboard() {

    document.getElementById("loginPage").style.display = "none";
    document.getElementById("dashboard").style.display = "block";

}

function showLogin() {

    document.getElementById("loginPage").style.display = "flex";
    document.getElementById("dashboard").style.display = "none";

}

function saveSession() {

    localStorage.setItem("cc_student_id", studentId);
    localStorage.setItem("cc_session_id", sessionId);

}

function logout() {

    localStorage.clear();
    location.reload();

}

async function login() {

    const code = document.getElementById("code").value.trim();
    const dob = document.getElementById("dob").value;

    if(!code || !dob){

        setMessage("Please fill in all fields");
        return;

    }

    try {

        const form = new URLSearchParams();

        form.append("code", code);
        form.append("dob", dob);
        form.append("remember", "true");

        // required by API
        form.append("recaptcha-token", "no-token-available");

        const response = await fetch(`${API_BASE}/login`, {
            method: "POST",
            headers: {
                "Content-Type": "application/x-www-form-urlencoded"
            },
            body: form
        });

        const data = await response.json();

        console.log(data);

        if(data.success === 1){

            studentId = data.data.id;
            sessionId = data.meta.session_id;

            saveSession();

            document.getElementById("studentName").innerText =
                `${data.data.first_name}'s Dashboard`;

            setMessage("Login successful", "success");

            showDashboard();

            await loadAll();

        } else {

            setMessage(data.error || "Login failed");

        }

    } catch(err){

        console.error(err);
        setMessage("Failed to connect to ClassCharts");

    }

}

async function api(endpoint){

    const response = await fetch(
        `${API_BASE}/${endpoint}/${studentId}`,
        {
            headers:{
                "Authorization": `Basic ${sessionId}`
            }
        }
    );

    return await response.json();

}

function renderList(elementId, items, renderer){

    const el = document.getElementById(elementId);

    if(!items || items.length === 0){

        el.innerHTML = `<div class="empty">No data available</div>`;
        return;

    }

    el.innerHTML = items.map(renderer).join("");

}

async function loadHomework(){

    const data = await api("homeworks");

    renderList("homework", data.data, hw => `
        <div class="item">
            <strong>${hw.title || "Homework"}</strong>

            <div class="small">
                ${hw.subject || ""}
            </div>

            <div class="small">
                Due: ${hw.due_date || "Unknown"}
            </div>
        </div>
    `);

}

async function loadBehaviour(){

    const data = await api("behaviour");

    renderList("behaviour", data.data, item => `
        <div class="item">

            <strong>
                ${item.reason || "Behaviour"}
            </strong>

            <div class="small">
                ${item.teacher_name || ""}
            </div>

            <div class="small ${item.points > 0 ? "green" : "red"}">

                ${item.points > 0 ? "+" : ""}
                ${item.points || 0} points

            </div>

        </div>
    `);

}

async function loadAnnouncements(){

    const data = await api("announcements");

    renderList("announcements", data.data, item => `
        <div class="item">

            <strong>
                ${item.title || "Announcement"}
            </strong>

            <div class="small">
                ${item.description || ""}
            </div>

        </div>
    `);

}

async function loadAttendance(){

    const data = await api("attendance");

    const attendance = data.meta || {};

    document.getElementById("attendance").innerHTML = `
        <div class="item">

            <strong>
                Overall Attendance
            </strong>

            <div class="small">
                ${attendance.percentage || "0"}%
            </div>

        </div>
    `;

}

async function loadActivity(){

    const data = await api("activity");

    renderList("activity", data.data, item => `
        <div class="item">

            <strong>
                ${item.title || "Activity"}
            </strong>

            <div class="small">
                ${item.description || ""}
            </div>

        </div>
    `);

}

async function loadClasses(){

    const data = await api("classes");

    renderList("classes", data.data, item => `
        <div class="item">

            <strong>
                ${item.name || "Class"}
            </strong>

            <div class="small">
                ${item.teacher_name || ""}
            </div>

        </div>
    `);

}

async function refreshSession(){

    try {

        const form = new URLSearchParams();

        form.append("include_data", "true");

        const response = await fetch(
            `${API_BASE}/ping`,
            {
                method:"POST",

                headers:{
                    "Authorization": `Basic ${sessionId}`,
                    "Content-Type":"application/x-www-form-urlencoded"
                },

                body:form
            }
        );

        const data = await response.json();

        if(data.meta?.session_id){

            sessionId = data.meta.session_id;

            localStorage.setItem(
                "cc_session_id",
                sessionId
            );

        }

    } catch(err){

        console.error(err);

    }

}

async function loadAll(){

    await refreshSession();

    await Promise.all([
        loadHomework(),
        loadBehaviour(),
        loadAnnouncements(),
        loadAttendance(),
        loadActivity(),
        loadClasses()
    ]);

}

async function restoreSession(){

    const storedStudentId =
        localStorage.getItem("cc_student_id");

    const storedSessionId =
        localStorage.getItem("cc_session_id");

    if(storedStudentId && storedSessionId){

        studentId = storedStudentId;
        sessionId = storedSessionId;

        showDashboard();

        await loadAll();

    }

}

restoreSession();

</script>

</body>
</html>
