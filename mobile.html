<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ClassCharts</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #f1f5f9; color: #0f172a; padding-bottom: 80px; }
        .nav-active { color: #2563eb; }
        .view { display: none; }
        .view.active { display: block; }
    </style>
</head>
<body>

<div id="loginPage" class="min-h-screen flex items-center justify-center p-4">
    <div class="bg-white rounded-3xl p-8 w-full max-w-sm shadow-lg">
        <h2 class="text-2xl font-bold mb-6">Sign In</h2>
        <div id="loginMessage" class="mb-4"></div>
        <input type="text" id="code" placeholder="Student Code" class="w-full p-4 rounded-xl bg-slate-100 mb-4 outline-none">
        <input type="date" id="dob" class="w-full p-4 rounded-xl bg-slate-100 mb-6 outline-none">
        <button onclick="login()" class="w-full p-4 rounded-xl bg-blue-600 text-white font-bold">Login</button>
    </div>
</div>

<div id="dashboard" class="hidden">
    <header class="p-4 bg-white border-b border-slate-200 sticky top-0 z-10 flex justify-between items-center">
        <h1 id="studentName" class="font-bold text-lg">Dashboard</h1>
        <button onclick="logout()" class="text-slate-500"><i class="fas fa-sign-out-alt"></i></button>
    </header>

    <main class="p-4 space-y-6">
        <div id="view-home" class="view active">
            <h2 class="text-sm font-bold text-slate-500 uppercase mb-3">Today</h2>
            <div id="attendance" class="bg-white p-4 rounded-2xl shadow-sm mb-4"></div>
            <div id="homework"></div>
        </div>
        <div id="view-behaviour" class="view">
            <h2 class="text-sm font-bold text-slate-500 uppercase mb-3">Behaviour</h2>
            <div id="behaviour"></div>
        </div>
        <div id="view-more" class="view">
            <h2 class="text-sm font-bold text-slate-500 uppercase mb-3">More</h2>
            <div id="announcements"></div>
            <div id="activity"></div>
            <div id="classes"></div>
        </div>
    </main>

    <nav class="fixed bottom-0 w-full bg-white border-t border-slate-200 p-3 flex justify-around">
        <button onclick="switchView('home', this)" class="nav-active flex flex-col items-center text-xs"><i class="fas fa-home text-xl"></i>Home</button>
        <button onclick="switchView('behaviour', this)" class="flex flex-col items-center text-xs"><i class="fas fa-chart-line text-xl"></i>Stats</button>
        <button onclick="switchView('more', this)" class="flex flex-col items-center text-xs"><i class="fas fa-ellipsis-h text-xl"></i>More</button>
    </nav>
</div>

<script>
    let studentId = localStorage.getItem("cc_student_id");
    let sessionId = localStorage.getItem("cc_session_id");

    function switchView(id, btn) {
        document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
        document.querySelectorAll('nav button').forEach(b => b.classList.remove('nav-active'));
        document.getElementById('view-' + id).classList.add('active');
        btn.classList.add('nav-active');
    }

    async function login() {
        const code = document.getElementById("code").value.trim();
        const dob = document.getElementById("dob").value;
        try {
            const response = await fetch("/login", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ code, dob })
            });
            const data = await response.json();
            if(data.success === 1) {
                studentId = data.data.id;
                sessionId = data.meta.session_id;
                localStorage.setItem("cc_student_id", studentId);
                localStorage.setItem("cc_session_id", sessionId);
                location.reload();
            } else {
                document.getElementById("loginMessage").innerText = data.error || "Login failed";
            }
        } catch(e) {
            document.getElementById("loginMessage").innerText = "Connection error";
        }
    }

    async function api(endpoint, params = "") {
        if (!sessionId) return { data: [], meta: {} };
        try {
            const url = `/api/${endpoint}/${studentId}${params ? '?' + params : ''}`;
            const res = await fetch(url, { headers: { Authorization: sessionId } });
            
            if (res.status === 401) {
                console.error("401 Unauthorized - Check session token validity");
                return { data: [], meta: {} };
            }
            
            const text = await res.text();
            try {
                return JSON.parse(text);
            } catch (e) {
                return { data: [], meta: {} };
            }
        } catch(e) { 
            return { data: [], meta: {} }; 
        }
    }

    async function loadAll() {
        const today = new Date().toISOString().split('T')[0];
        const [hw, bh, an, at, ac, cl] = await Promise.all([
            api("homeworks"), 
            api("behaviour"), 
            api("announcements"), 
            api("attendance", `from=${today}&to=${today}`), 
            api("activity"), 
            api("classes")
        ]);
        
        document.getElementById("homework").innerHTML = hw.data?.map(i => `<div class="bg-white p-4 rounded-2xl shadow-sm mb-3 font-bold">${i.title}</div>`).join('') || '';
        document.getElementById("behaviour").innerHTML = bh.data?.map(i => `<div class="bg-white p-4 rounded-2xl shadow-sm mb-3">${i.reason} <span class="${i.points > 0 ? 'text-green-500' : 'text-red-500'} font-bold">${i.points}</span></div>`).join('') || '';
        document.getElementById("announcements").innerHTML = an.data?.map(i => `<div class="bg-white p-4 rounded-2xl shadow-sm mb-3">${i.title}</div>`).join('') || '';
        document.getElementById("attendance").innerHTML = `Attendance: ${at.meta?.percentage || 0}%`;
        document.getElementById("activity").innerHTML = ac.data?.map(i => `<div class="bg-white p-4 rounded-2xl shadow-sm mb-3">${i.title}</div>`).join('') || '';
        document.getElementById("classes").innerHTML = cl.data?.map(i => `<div class="bg-white p-4 rounded-2xl shadow-sm mb-3">${i.name}</div>`).join('') || '';
    }

    function logout() { localStorage.clear(); location.href = "/"; }

    if(studentId && sessionId) {
        document.getElementById("loginPage").style.display = "none";
        document.getElementById("dashboard").style.display = "block";
        setTimeout(loadAll, 500);
    }
</script>
</body>
</html>
