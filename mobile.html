<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ClassCharts Dashboard</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Inter, Arial, sans-serif;
}

body {
    background: #0f172a;
    color: white;
    min-height: 100vh;
}

header {
    background: #111827;
    padding: 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid #1f2937;
}

header h1 {
    font-size: 24px;
}

.container {
    max-width: 1200px;
    margin: auto;
    padding: 20px;
}

.login-box {
    max-width: 400px;
    margin: 100px auto;
    background: #111827;
    padding: 30px;
    border-radius: 20px;
    border: 1px solid #1f2937;
}

.login-box h2 {
    margin-bottom: 20px;
}

input {
    width: 100%;
    padding: 14px;
    margin-bottom: 15px;
    border-radius: 12px;
    border: none;
    background: #1f2937;
    color: white;
}

button {
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 12px;
    background: #2563eb;
    color: white;
    font-weight: bold;
    cursor: pointer;
    transition: 0.2s;
}

button:hover {
    opacity: 0.9;
</html>
