<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Email Sender Tool</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4">
    <div class="bg-white p-8 rounded-xl shadow-lg w-full max-w-md">
        <h1 class="text-2xl font-bold mb-6 text-gray-800 flex items-center gap-2">
            <i class="fa-solid fa-envelope"></i> Send Test Email
        </h1>
        <form id="emailForm" class="space-y-4">
            <div>
                <label for="email" class="block text-sm font-medium text-gray-700 mb-1">Recipient Email</label>
                <input type="email" id="email" required 
                    class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all"
                    placeholder="example@domain.com">
            </div>
            <button type="submit" id="submitBtn"
                class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2 px-4 rounded-lg transition-colors flex items-center justify-center gap-2">
                <i class="fa-solid fa-paper-plane"></i> Send Request
            </button>
        </form>
        <div id="messageBox" class="mt-4 p-3 rounded-lg hidden text-sm"></div>
    </div>

    <script>
        const form = document.getElementById('emailForm');
        const messageBox = document.getElementById('messageBox');
        const submitBtn = document.getElementById('submitBtn');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Sending...';
            
            try {
                const response = await fetch('https://izcixahquohigrzghyqv.supabase.co/functions/v1/send-email-test', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email })
                });

                if (response.ok) {
                    showMessage('Email request sent successfully!', 'bg-green-100 text-green-700');
                } else {
                    showMessage('Failed to send email. Please try again.', 'bg-red-100 text-red-700');
                }
            } catch (error) {
                showMessage('Connection error occurred.', 'bg-red-100 text-red-700');
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerHTML = '<i class="fa-solid fa-paper-plane"></i> Send Request';
            }
        });

        function showMessage(text, className) {
            messageBox.textContent = text;
            messageBox.className = `mt-4 p-3 rounded-lg text-sm ${className}`;
            messageBox.classList.remove('hidden');
        }
    </script>
</body>
</html>
