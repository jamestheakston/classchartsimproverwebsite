<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found | ClassCharts Improver</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/feather-icons"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap');
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 flex items-center justify-center min-h-screen p-6">

    <div class="max-w-md w-full text-center">
        <h1 class="text-8xl font-extrabold text-slate-200 mb-2">404</h1>
        <h2 class="text-3xl font-bold mb-4">Page Not Found</h2>
        
        <p class="text-slate-600 mb-8 leading-relaxed">
            The page you're looking for has moved or been deleted.
        </p>

        <div class="space-y-3">
            <a href="/" class="block w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 px-6 rounded-xl transition-all shadow-lg shadow-blue-100 flex items-center justify-center gap-2">
                <i data-feather="home" class="w-5 h-5"></i>
                Back to Home
            </a>
            
            <a href="https://chromewebstore.google.com/detail/classcharts-improver/kalmdpfngeebamgaeegkieojhbkbghoe" 
               class="block w-full bg-white border border-slate-200 hover:border-blue-400 text-slate-700 font-semibold py-3 px-6 rounded-xl transition-all flex items-center justify-center gap-2">
                <i data-feather="chrome" class="w-5 h-5"></i>
                Get the Chrome Extension
            </a>
        </div>

        <div class="mt-12 text-sm text-slate-400 space-y-2">
            <p>Looking for the <a href="/firefoxeol" class="underline hover:text-blue-500 text-slate-500">Firefox EOL announcement</a>?</p>
            <p>Need more help? Ask our redditors at <a href="https://www.reddit.com/r/ClassChartsImprover/" class="hover:text-slate-600 underline">r/ClassChartsImprover</a></p>
        </div>
    </div>

    <script>
        feather.replace();
    </script>
</body>
</html>
